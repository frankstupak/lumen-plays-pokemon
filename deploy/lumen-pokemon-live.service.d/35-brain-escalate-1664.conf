# wq#1664: the rescue brain roles must not be the primary model.
#
# The live unit's 30-brain-env.conf (2026-09-10, Z.ai funding) pins all four
# brain roles to glm-5.3-flash-zai. With that shape `escalate` on
# stall_12_turns and the no-ACT `actRetry` both re-ask the model that just
# failed: same prompt, same weights, same answer, one extra billed call. It
# fired 56/352/337 times a day in the 08-27..09-02 window (M7,
# foreman/research/LPP_BEHAVIORAL_ANALYSIS.md).
#
# src/config.ts now REFUSES TO BOOT in that shape (brainConfigErrors(), exit 2),
# so this drop-in has to be installed with the code that lands it.
#
# Install (drop-ins apply in lexical order, so 35- wins over 30-):
#   install -m 644 deploy/lumen-pokemon-live.service.d/35-brain-escalate-1664.conf \
#       /etc/systemd/system/lumen-pokemon-live.service.d/
#   systemctl daemon-reload && systemctl restart lumen-pokemon-live
#   (both as root)
#
# Equivalent alternative: DELETE the LPP_BRAIN_ESCALATE and LPP_BRAIN_ACTRETRY
# lines from 30-brain-env.conf. config.ts now defaults both roles to the first
# rung of LPP_BRAIN_FALLBACK_MODELS that differs from primary, which for that
# drop-in's ladder (cerebras-oss-120b,qwen36-local) is exactly the value below.
#
# cerebras-oss-120b rather than qwen36-local on purpose: it is a different
# provider AND family from glm (a second opinion, not a second sample), it is
# cloud-fast, and qwen36-local is the single-decode-slot model whose saturation
# cost 12h in wq#907.
[Service]
Environment=LPP_BRAIN_ESCALATE=cerebras-oss-120b
Environment=LPP_BRAIN_ACTRETRY=cerebras-oss-120b
